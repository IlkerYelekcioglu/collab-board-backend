services:
  postgres:
    image: postgres:16-alpine
    container_name: collabboard-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"          # host:5435 -> konteyner:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: collabboard-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: collabboard-backend
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: collab-board-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres-data: